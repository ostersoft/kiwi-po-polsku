language: "pl"
locale: "pl_PL"
timezone: "Europe/Warsaw"

# Rozpoznawanie mowy
stt:
  engine: "faster-whisper"
  model: "large-v3-turbo"

  # Jeśli CUDA działa:
  device: "cuda"
  compute_type: "float16"

  # Jeśli CUDA nie działa, użyj zamiast powyższych:
  # device: "cpu"
  # compute_type: "int8"

  language: "pl"
  beam_size: 5
  best_of: 5

  vad_filter: true
  vad_parameters:
    min_silence_duration_ms: 500
    speech_pad_ms: 250

  condition_on_previous_text: false
  no_speech_threshold: 0.6

  initial_prompt: >
    Rozmowa prowadzona jest w języku polskim.
    Asystent głosowy nazywa się Kiwi.
    Rozpoznawaj poprawnie polskie nazwy, odmiany wyrazów,
    liczby, godziny, nazwy urządzeń i pomieszczeń.
    Przykładowe polecenia:
    włącz światło w salonie,
    wyłącz ogrzewanie,
    ustaw temperaturę na dwadzieścia dwa stopnie,
    zamknij rolety,
    ustaw timer na dziesięć minut,
    jaka jest pogoda.

# Słowo wybudzające
wake_word:
  engine: "text"
  keyword: "kiwi"
  aliases:
    - "kiwi"
    - "hej kiwi"
    - "kiwii"
  fuzzy_match: true
  normalize: true

# Synteza mowy
tts:
  provider: "piper"
  voice: "pl_PL-gosia-medium"
  length_scale: 1.0
  normalize_text: true

speaker_id:
  enabled: true
  backend: "sherpa_onnx"
  model_path: "models/speaker/wespeaker_en_voxceleb_resnet34.onnx"
  min_segment_sec: 2.0
  threshold: 0.50

# Priorytet rozmówców
speaker_priority:
  owner:
    name: "Owner"